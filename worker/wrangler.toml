name = "scrape-monitor"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

[triggers]
crons = ["17 */6 * * *", "43 3 * * *"]   # scrape every 6 h at :17; retention daily at 03:43 UTC

[[d1_databases]]
binding = "DB"
database_name = "scrape-monitor"
database_id = "8b4bec5e-9c9e-48c7-ab11-9ec3d920e3e4"
migrations_dir = "../migrations"

[vars]
USER_AGENT = "cf-scrape-monitor/0.1 (+https://scrape-monitor-dashboard.pages.dev/about)"